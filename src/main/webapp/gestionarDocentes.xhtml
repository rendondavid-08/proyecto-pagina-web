<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title></title>
    </h:head>

    <h:body>
        <h:form id="formulario">
            <p:card style="width: 35rem; margin-bottom: 2em">

                <f:facet name="title">Gestionar Docentes</f:facet>
                <h:panelGrid columns ="3">

                    <p:outputLabel>Nombre :</p:outputLabel>
                    <p:inputText id="txfNombre" value="#{control.docente.nombre}"></p:inputText>
                    <p:message for="txfNombre"></p:message>

                    <p:outputLabel>Apellidos :</p:outputLabel>
                    <p:inputText id="txfApellidos" value="#{control.docente.apellido}"></p:inputText>
                    <p:message for="txfApellidos"></p:message>

                    <p:outputLabel>Nuip :</p:outputLabel>
                    <p:inputText id="txfNuip" value="#{control.docente.nuip}"></p:inputText>
                    <p:message for="txfNuip"></p:message>

                    <p:outputLabel>Profesion :</p:outputLabel>
                    <p:inputText id="txfProfesion" value="#{control.docente.profesion}"></p:inputText>
                    <p:message for="txfProfesion"></p:message>

                </h:panelGrid>

                <p:messages id="mensajes" globalOnly="true" closable="true"/>

                <f:facet name="footer">
                    <p:commandButton icon="pi pi-check" value="Save"
                                     action = "#{control.guardar()}"
                                     process = "@this txfNombre txfApellidos txfNuip txfProfesion"
                                     update = "mensajes txfNombre txfApellidos txfNuip txfProfesion tabla"/>
                    <p:commandButton icon="pi pi-times" value="Cancel"
                                     styleClass="ui-button-secondary"
                                     style="margin-left: .5em"
                                     action = "#{control.cancelar()}"
                                     process = "@this"
                                     update = "mensajes txfNombre txfApellidos txfNuip txfProfesion"/>
                </f:facet>
            </p:card>
        </h:form>
                    <p:dataTable id="tabla" var="a" value="#{control.docentes}">
                            <p:column headerText="Nombre"><h:outputText value="#{a.nombre}" /></p:column>
                            <p:column headerText="Apellido"><h:outputText value="#{a.apellido}" /></p:column>
                            <p:column headerText="Nuip"><h:outputText value="#{a.nuip}" /></p:column>
                            <p:column headerText="Profesion"><h:outputText value="#{a.profesion}" /></p:column>
                        </p:dataTable>
        
    </h:body>

</html>
