<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title></title>
    </h:head>

    <h:body>

        <p:card>
            <f:facet name="title">Gestionar asignaturas</f:facet>
            <h:panelGrid columns ="3">
                <p:outputLabel>Codigo :</p:outputLabel>
                <p:inputText id="txfCodigo"></p:inputText>
                <p:message for="txfCodigo"></p:message>
                
                <p:outputLabel>Nombre :</p:outputLabel>
                <p:inputText id="txfNombre"></p:inputText>
                <p:message for="txfNombre"></p:message>
                
                <p:outputLabel>Creditos :</p:outputLabel>
                <p:inputNumber id="txfCreditos"></p:inputNumber>
                <p:message for="txfCreditos"></p:message>
                
                <p:outputLabel>Intensidad :</p:outputLabel>
                <p:inputNumber id="txfIntensidad"></p:inputNumber>
                <p:message for="txfIntensidad"></p:message>
                
            </h:panelGrid>
            
            <f:facet name="footer">
                <p:commandButton icon="pi pi-check" value="Save"/>
                <p:commandButton icon="pi pi-times" value="Cancel"
                                 styleClass="ui-button-secondary"
                                 style="margin-left: .5em"/>
            </f:facet>
        </p:card>
        <p:card>
            <h:form>
                <p:dataTable var="a" value="#{asignaturaBean.lista}">

                    <p:column headerText="Código">
                        <h:outputText value="#{a.codigo}" />
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{a.nombre}" />
                    </p:column>

                    <p:column headerText="Créditos">
                        <h:outputText value="#{a.creditos}" />
                    </p:column>

                    <p:column headerText="Intensidad">
                        <h:outputText value="#{a.intensidad}" />
                    </p:column>

                </p:dataTable>
            </h:form>
        </p:card>
    </h:body>

</html>
