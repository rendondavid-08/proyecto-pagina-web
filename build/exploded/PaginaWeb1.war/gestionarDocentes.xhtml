<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title></title>
    </h:head>

    <h:body>

        <p:card>
            <f:facet name="title">Gestionar Docentes</f:facet>
            <h:panelGrid columns ="3">
                
                <p:outputLabel>Nombre :</p:outputLabel>
                <p:inputText id="txfNombre"></p:inputText>
                <p:message for="txfNombre"></p:message>
                
                <p:outputLabel>Apellidos :</p:outputLabel>
                <p:inputNumber id="txfApellidos"></p:inputNumber>
                <p:message for="txfApellidos"></p:message>
                
                <p:outputLabel>Nuip :</p:outputLabel>
                <p:inputText id="txfNuip"></p:inputText>
                <p:message for="txfNuip"></p:message>
                
                <p:outputLabel>Genero :</p:outputLabel>
                <p:inputNumber id="txfGenero"></p:inputNumber>
                <p:message for="txfGenero"></p:message>
                
                <p:outputLabel>Profesion :</p:outputLabel>
                <p:inputNumber id="txfProfesion"></p:inputNumber>
                <p:message for="txfProfesion"></p:message>
                
            </h:panelGrid>
            
            <f:facet name="footer">
                <p:commandButton icon="pi pi-check" value="Save"/>
                <p:commandButton icon="pi pi-times" value="Cancel"
                                 styleClass="ui-button-secondary"
                                 style="margin-left: .5em"/>
            </f:facet>
        </p:card>

    </h:body>

</html>
